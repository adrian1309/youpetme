# Required PR checks (ARCH-003).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Formatting verification
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: API integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

  # A separate job because of the browsers' runtime requirements (ARCH-003). `pnpm test:e2e` builds
  # the apps and starts PostgreSQL through infra/docker, the same way as on a developer's machine.
  e2e:
    name: E2E
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @youpetme/web exec playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report/
            apps/web/e2e/test-results/
          retention-days: 7
